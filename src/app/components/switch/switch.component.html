<div 
  class="w-fit p-2"
>
  <div 
    class="w-full flex justify-center items-center mb-1"
  >
    {{ label() }}
  </div>
  <div 
    class="flex d-flex toggle-switch" 
    [class.active]="status()" 
    (click)="toggle()"
  >
    <span 
      class="label"
    >
      {{ status() ? 'ON' : 'OFF' }}
    </span>
  </div>
</div>
