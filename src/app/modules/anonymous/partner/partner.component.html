
<div 
  class="p-6 max-w-[1530px] mx-auto mt-4"
>

    class="text-xl font-bold mb-10"

    Our Partners
  </h2>
  
  <!-- Container: 1 col on mobile, 3 cols on medium screens+ -->
  <div 
    class="grid grid-cols-2 md:grid-cols-4 gap-4"
  >
  
    @for(partner of partners(); track partner.logo)
    {

        > -->
