
<!-- Container wrapper that masks the overflow -->
<div class="w-full inline-flex flex-nowrap overflow-hidden [mask-image:_linear-gradient(to_right,transparent_0,_black_128px,_black_calc(100%-128px),transparent_100%)]">
    
    <!-- First scroller container -->
    <ul 
        class="flex items-center justify-center md:justify-start [&_li]:mx-8 [&_img]:max-w-none animate-infinite-scroll"
    >
        @for(partner of partners(); track partner.logo)
        {
            <!-- <li><img src="partner().logo" alt="partner.logo" /></li> -->
             <li>
                <app-image
                  [src]="partner.logo"
                  [alt]="partner.alt"
                  [customClass]="customClass()"
                  objectFit="contain"
                >
                </app-image>
             </li>
        }
    </ul>
    
    <!-- Second exact duplicate scroller container (Hidden from screen readers) -->
    <ul 
        class="flex items-center justify-center md:justify-start [&_li]:mx-8 [&_img]:max-w-none animate-infinite-scroll" aria-hidden="true"
    >
        @for(partner of partners(); track partner.logo)
        {
            <!-- <li><img src="partner.logo" alt="partner.logo" /></li> -->
                         <!-- <li><img src="partner.logo" alt="partner.logo" /></li> -->
             <li>
                <app-image
                  [src]="partner.logo"
                  [alt]="partner.alt"
                  [customClass]="customClass()"
                  objectFit="contain"
                >
                </app-image>
             </li>
        }
    </ul>
    
</div>
