<div 
   class='container mx-auto mt-1 md:mt-1 mb-7 flex-col md:flex max-h-fit'
>
    <div 
      class="w-12/12 md:w-12/12 px-2"
    >
      <p 
        class="text-gray-500 font-bold mb-5 ml-4"
      >
        {{ PageTitle }}
      </p>
    <div>
    
   <div 
     class="p-2 md:p-1 overflow-y-auto overflow-y-scroll min-h-fit max-h-fit"
   >
      @if(resources()?.length > 0)
      {
        @for(resource of resources(); track resource.name)
        {         
          <div
            class="w-full justify-center items-center overflow-x-auto overflow-x-scroll border-2 mb-1 p-1"
          >
            <div 
              class="col-span-12 bg-blue-100 grid grid-cols-12 gap-0 bg-gray-100"
            >
                <div 
                  class="col-span-8 md:col-span-10 md:col-span-8 px-2 py-3 font-bold flex items-left text-left"
                >
                  {{ 'action?.name' }}
                </div>
            </div>
            <div 
              class="col-span-12 grid md:grid-cols-12 grid-cols-6 gap-2 whitespace-nowrap px-2 py-3 text-sm"
            >
              {{ 'action?.description' }}
            </div>
          </div>  
        }
      }
   </div>

</div>
