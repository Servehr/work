<div 
  class="py-4 px-6"
>
  <p 
    class="text-[20px]"
  >
    Infomration about the company
  </p>

  <form 
    [formGroup]="aboutForm"
  >
    <div 
      class="w-full mb-4 mt-4"
    >
      <input-field
        [id]="'writeHeader'"
        #password
        [name]="'writeHeader'"
        [placeholder]="'Enter Header ttle'"
        [type]="'text'"
        [value]="dataToUpdate()?.data?.title"
        formControlName="writeHeader"
        [customErrorMessages]="errorMessages"
      >
      </input-field>
    </div>


    <div 
      class="flex flex-col space-y-1 text-gray-200 mb-4"
    >
      <app-text-area  
        placeholder="Write Something"
        [rows]="rows"
        [cols]="cols"
        formControlName="writeSomething"
        [customErrorMessages]="errorMessages"  
        [value]="dataToUpdate()?.data?.aboutus" 
      >
      </app-text-area>            
        <!-- [value]="'glory'"  -->
         <!-- dataToUpdate()?.data?.description -->
    </div>    
    
    <!-- <div 
      class="mb-4"
    >
      <app-wysiwyg 
        (inputedData)="contentData($event)"
        [content]="content()"
      >
      </app-wysiwyg>
    </div> -->

    <div 
      class="w-full flex justify-between mx-auto gap-10 mb-4"
    >
      <div 
        class="w-full"
      >
        <app-image-upload 
          [customErrorMessages]="errorMessages"
        >
        </app-image-upload>
      </div>
    </div>    

    <div
      class="md:flex z-30 mb-5"
    >
      <app-botin
        (ChangeOnButtonHoverIn)="ChangeOnButtonHoverIn()" 
        (ChangeOnButtonHoverOut)="ChangeOnButtonHoverOut()"
        (sendData)="Write()"
        [disabled]="disabled()"
        [style]="style"
      >
        <div
          class="flex flex-col space-y-1 items-center justify-between"
        >
          @if(isLoading())
          {
            <p class="font-bold text-white"> ... </p>
          }
          @if(!isLoading())
          {
            <h3>{{ buttonName() }}</h3>
          }
       </div>
      </app-botin>    
    </div>
  </form>      

</div>
